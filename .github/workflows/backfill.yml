name: 歷史回補

# 手動觸發。回補近十年的每月估值快照（上市／上櫃）。
# 對官方站台友善：每次請求之間留間隔，可分年執行避免單次跑太久。
on:
  workflow_dispatch:
    inputs:
      years:
        description: "回補幾年（預設 10）"
        required: false
        default: "10"
      start_year:
        description: "只補這一年（西元，留空表示補完整區間）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 回補
        working-directory: scripts
        env:
          BACKFILL_YEARS: ${{ inputs.years }}
          BACKFILL_START_YEAR: ${{ inputs.start_year }}
        run: python backfill_history.py

      - name: 重建歷史與個股頁
        working-directory: scripts
        run: |
          python build_pe_periods.py
          python rebuild_history.py

      - name: commit 資料
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "無新資料"
          else
            git commit -m "歷史回補 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git push
          fi
